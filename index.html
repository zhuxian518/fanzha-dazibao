<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>反诈大字报 · 拦一下</title>
<meta name="description" content="输入爸妈在买的东西，十秒生成骗子风格反诈大字报，内容全是真实判决">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #F5F2EA; color: #222; min-height: 100vh; padding-bottom: 96px; }
header { background: #B01111; color: #FFD700; text-align: center; padding: 14px 12px 12px; }
header h1 { font-size: 24px; font-weight: 900; letter-spacing: 2px; }
header p { font-size: 13px; color: #FFEDB0; margin-top: 3px; }
main { max-width: 560px; margin: 0 auto; padding: 14px 14px 0; }
.search-box { display: flex; gap: 8px; }
.search-box input { flex: 1; font-size: 16px; padding: 13px 14px; border: 2px solid #B01111; border-radius: 10px; outline: none; background: #fff; }
.search-box button { background: #B01111; color: #FFD700; font-size: 16px; font-weight: 700; border: none; border-radius: 10px; padding: 0 22px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chip { font-size: 14px; padding: 7px 14px; border-radius: 999px; background: #fff; border: 1.5px solid #D8A94E; color: #7A0B0B; }
.chip:active { background: #B01111; color: #FFD700; }
.all-toggle { margin-top: 10px; font-size: 14px; color: #B01111; text-align: center; padding: 6px; }
.hit-tabs { display: flex; gap: 8px; overflow-x: auto; margin-top: 12px; padding-bottom: 4px; }
.hit-tab { flex-shrink: 0; font-size: 14px; padding: 8px 14px; border-radius: 8px; background: #fff; border: 1.5px solid #ccc; }
.hit-tab.on { background: #B01111; color: #fff; border-color: #B01111; }
.card-wrap { margin-top: 12px; text-align: center; position: relative; }
.card-wrap img { width: 100%; border-radius: 10px; box-shadow: 0 4px 18px rgba(90,10,10,.25); }
.arrow-btn { position: absolute; top: 45%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,.45); color: #fff; font-size: 20px; border: none; }
.arrow-btn.left { left: 6px; } .arrow-btn.right { right: 6px; }
.tpl-name { font-size: 13px; color: #888; margin-top: 8px; }
.variant-btn { display: block; margin: 8px auto 0; font-size: 14px; color: #B01111; background: none; border: 1.5px dashed #B01111; border-radius: 8px; padding: 7px 18px; }
.verified-tag { display: inline-block; font-size: 12px; color: #0F6E56; border: 1px solid #0F6E56; border-radius: 4px; padding: 1px 6px; margin-left: 6px; }
.pending-tag { display: inline-block; font-size: 12px; color: #854F0B; border: 1px solid #854F0B; border-radius: 4px; padding: 1px 6px; margin-left: 6px; }
.actions { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #e5e0d2; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 10px; justify-content: center; max-width: 588px; margin: 0 auto; }
.actions button { flex: 1; max-width: 220px; font-size: 17px; font-weight: 700; padding: 13px 0; border: none; border-radius: 12px; }
#btn-save { background: #B01111; color: #FFD700; }
#btn-copy { background: #FFF3D6; color: #7A0B0B; border: 1.5px solid #D8A94E !important; }
#save-hint { display: none; margin-top: 8px; font-size: 13px; color: #7A0B0B; background: #FFF3D6; border-radius: 8px; padding: 8px; text-align: center; }
details { margin-top: 14px; background: #fff; border-radius: 10px; padding: 12px 14px; font-size: 14px; }
details summary { color: #B01111; font-weight: 700; }
details .ev { margin-top: 8px; color: #555; line-height: 1.7; }
details .soft { margin-top: 8px; color: #0F6E56; background: #E1F5EE; border-radius: 8px; padding: 8px 10px; }
.catalog { margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cat-item { background: #fff; border: 1.5px solid #e0d9c6; border-radius: 8px; padding: 9px 10px; font-size: 13px; text-align: left; }
.cat-item b { display: block; font-size: 14px; color: #7A0B0B; }
footer { text-align: center; font-size: 12px; color: #999; padding: 18px 14px 10px; line-height: 1.7; }
.toast { position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); background: rgba(0,0,0,.8); color: #fff; font-size: 14px; padding: 9px 18px; border-radius: 8px; display: none; z-index: 99; }
.hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>反诈大字报</h1>
  <p>输入爸妈在买的东西 → 生成骗子风格大字报 · 内容全是真实判决</p>
</header>
<main>
  <div class="search-box">
    <input id="q" type="search" placeholder="如：床垫 / 鸡蛋 / 神药 / 刷单" enterkeyhint="search">
    <button id="btn-go">生成</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="all-toggle" id="all-toggle">▸ 全部场景（18 类）</div>
  <div class="catalog hidden" id="catalog"></div>
  <div class="hit-tabs hidden" id="hit-tabs"></div>
  <div class="card-wrap" id="card-wrap">
    <img id="card-img" alt="反诈大字报卡片">
    <button class="arrow-btn left hidden" id="btn-prev">‹</button>
    <button class="arrow-btn right hidden" id="btn-next">›</button>
  </div>
  <div class="tpl-name" id="tpl-name"></div>
  <div class="tpl-name" id="stat-line" style="margin-top:2px"></div>
  <button class="variant-btn hidden" id="btn-variant">换一条实锤</button>
  <div id="save-hint">长按上方图片 → 保存到手机 / 发送给朋友</div>
  <details class="hidden" id="ev-detail">
    <summary>这张卡的信息来源（点开核验）</summary>
    <div class="ev" id="ev-body"></div>
    <div class="soft" id="soft-body"></div>
  </details>
</main>
<div class="actions">
  <button id="btn-save">保存图片</button>
  <button id="btn-copy">复制温柔话术</button>
</div>
<footer>
  本产品仅为公开裁判文书与官方通报的信息聚合展示，具体案件以官方发布为准 · 不提供理财与医疗建议<br>
  遇诈骗请拨 96110 · 用 WorkBuddy 造
</footer>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="templates.js"></script>
<script src="app.js"></script>
</body>
</html>
